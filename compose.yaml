services:
  ts:
    image: tailscale/tailscale:v1.104.4
    hostname: skylight
    env_file: ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/ts.env   # TS_AUTHKEY=...
    environment:
      - TS_HOSTNAME=skylight
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    restart: unless-stopped

  auth:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.2
    network_mode: service:ts
    depends_on: [ts, skylight]
    # proxy_token.env sends the auth proxy's own client token to the gateway
    # (ADR 0003); a separate file, so proxy.env never needs re-entering.
    env_file:
      - ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/proxy.env        # GITHUB_*, EXTERNAL_URL
      - ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/proxy_token.env  # PROXY_BEARER_TOKEN=...
    environment:
      - NO_AUTO_TLS=true
      - LISTEN=:8000
      - DATA_PATH=/data
    volumes:
      - ./auth-data:/data           # signing keys and OAuth state; must persist
    # No path: the proxy appends the incoming path (Go's ProxyRequest.SetURL),
    # so /mcp reaches the gateway as /mcp. ".../mcp" here would make it /mcp/mcp.
    command: ["--", "http://127.0.0.1:8001"]
    restart: unless-stopped

  skylight:
    build: .
    network_mode: service:ts
    depends_on: [ts]
    read_only: true
    tmpfs: [/tmp]
    secrets: [skylight_email, skylight_password, mcp_confirm_secret,
              client_token_auth_proxy, client_token_ixl_nas]
    volumes:
      - ./data:/data                # token cache; must persist
    restart: unless-stopped

secrets:
  skylight_email:
    file: ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/skylight_email
  skylight_password:
    file: ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/skylight_password
  mcp_confirm_secret:
    file: ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/mcp_confirm_secret
  client_token_auth_proxy:   # same value as PROXY_BEARER_TOKEN in proxy_token.env
    file: ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/client_token_auth_proxy
  client_token_ixl_nas:      # ixl-nas holds a copy as /volume1/docker/secrets/ixl/skylight_token
    file: ${SECRETS_DIR:-/volume1/docker/secrets/skylight}/client_token_ixl_nas
